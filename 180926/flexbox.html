<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <link rel="stylesheet" href="css/flexbox.css">
</head>

<body>
    <!-- Cabeçalho do site -->
    <header id="top" class="container">
        <div class="col-100">
            Topo Site
        </div>
        <hr>
    </header>
    
    <main>
        <div id="banner" class="container">
            <div class="col-100">
                <img style="width: 100%; height: auto;" 
                src="img/banner.png" alt="Banner">
            </div>
        </div>
        <hr>

        <div id="blocos" class="container">
            <div class="col-30">1 Bloco</div>
            <div class="col-30">2 Bloco</div>
            <div class="col-30">3 Bloco</div>
        </div>
        <hr>
    </main>

    <footer id="rodape" class="container">
        <div class="col-100">Rodape</div>
    </footer>
</body>

</html>
