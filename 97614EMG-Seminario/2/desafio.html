<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXBOX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            gap: 1px;
            flex-direction: row;
        }

        .blicos{
            height:300px }

        .container div {
            display: flex;
            background-color: rgb(187, 255, 0);
            padding: 100px;
            

        }

        .col-10 {
            flex: 0 0 10%;
        }

        .col-30 {
            flex: 0 0 30%;
        }

        .col-50{
            flex: 0 0 50%}

        .col-70 {
            flex: 0 0 70%;
        }

        .col-100 {
            flex: 0 0 100%;
        }

        #blocos {
            justify-content: center;
        }

        #rodape {
            position: relative;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: rgb(187, 255, 0);
            
        }
    </style>
</head>

<body>
    <header id="top" class="container">
        <div class="col-100">
            Topo site
        </div>
        <hr>
    </header>
    <main>
        </div>
        <hr>
<div class="container">
<div class="col-50" class="blicos">Bloco 4</div>
<div class="col-50" class="blicos">Bloco 5</div>
</div>
<hr>
<div class="container">
<div class="col-70" class="blicos">Bloco 6</div>
<div class="col-30" class="blicos">Bloco 7</div>
</div>
</div>
<hr>
        <div id="blocos" class="container">
            <div class="col-30" class="blicos">1 bloco</div>
            <div class="col-30" class="blicos">2 bloco</div>
            <div class="col-30" class="blicos">3 bloco</div>
        </div>
        <hr>
        <div class="container">
            <div class="col-50">sim</div>
            <div class="col-50">não</div>
        </div>
        <hr>
    </main>
    <footer id="rodape" class="container" class="blicos">
        <div class="col-70">roda</div>
        <div class="col-30">pe</div>
    </footer>
</body>

</html>
