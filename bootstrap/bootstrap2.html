<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Bootstrap</title>

  <!-- CSS do Bootstrap 5 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Ícones do Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

  <!-- Cabecalho -->
  <header class="navbar navbar-dark bg-dark sticky-top p-3 shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-speedometer2 me-2"></i>Painel de Controle</a>
      <span class="navbar-text text-white">Usuário: Admin</span>
    </div>
  </header>

  <div class="container my-4">
    
    <!-- Linha de Cards de Metricas -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card bg-primary text-white shadow-sm border-0">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <h6 class="card-subtitle mb-1">Vendas Totais</h6>
              <h3 class="card-title mb-0">R$ 45.200</h3>
            </div>
            <i class="bi bi-currency-dollar fs-1 opacity-50"></i>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card bg-success text-white shadow-sm border-0">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <h6 class="card-subtitle mb-1">Novos Clientes</h6>
              <h3 class="card-title mb-0">+128</h3>
            </div>
            <i class="bi bi-people fs-1 opacity-50"></i>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card bg-warning text-dark shadow-sm border-0">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <h6 class="card-subtitle mb-1">Pedidos Pendentes</h6>
              <h3 class="card-title mb-0">15</h3>
            </div>
            <i class="bi bi-clock-history fs-1 opacity-50"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Conteudo Principal: Tabela + Formulario -->
    <div class="row g-4">
      
      <!-- Tabela de Pedidos Recentes -->
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3 fw-bold">
            <i class="bi bi-list-check me-2"></i>Últimos Pedidos
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th># ID</th>
                    <th>Cliente</th>
                    <th>Status</th>
                    <th>Valor</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>#1024</td>
                    <td>Ana Silva</td>
                    <td><span class="badge bg-success">Concluído</span></td>
                    <td>R$ 250,00</td>
                  </tr>
                  <tr>
                    <td>#1025</td>
                    <td>Carlos Souza</td>
                    <td><span class="badge bg-warning text-dark">Pendente</span></td>
                    <td>R$ 120,50</td>
                  </tr>
                  <tr>
                    <td>#1026</td>
                    <td>Mariana Costa</td>
                    <td><span class="badge bg-danger">Cancelado</span></td>
                    <td>R$ 89,90</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Formulario para Cadastrar Novo Cliente -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3 fw-bold">
            <i class="bi bi-person-plus me-2"></i>Cadastrar Cliente
          </div>
          <div class="card-body">
            <form>
              <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" class="form-field form-control" id="nome" placeholder="Ex: João Silva">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-field form-control" id="email" placeholder="nome@email.com">
              </div>
              <div class="mb-3">
                <label for="plano" class="form-label">Plano</label>
                <select class="form-select" id="plano">
                  <option selected>Selecione um plano...</option>
                  <option value="1">Básico</option>
                  <option value="2">Pro</option>
                  <option value="3">Enterprise</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-check-circle me-1"></i>Salvar
              </button>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript do Bootstrap via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
