<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo Bootstrap</title>
  
  <!-- CSS do Bootstrap 5 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>

<body class="bg-dark">

  <!-- Navbar / Menu Superior -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="#">Minha Loja</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Produtos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contato</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <div class="container my-5">
    <div class="row justify-content-center">
      
      <!-- Card do Produto -->
      <div class="col-md-3 col-lg-5">
        <div class="card shadow-sm">
          <img src="produto.jpg" class="card-img-top" alt="Imagem do Produto">
          <div class="card-body text-center">
            <h5 class="card-title">Produto Exemplo</h5>
            <p class="card-text text-muted">Descrição curta do produto utilizando as classes utilitárias de texto do Bootstrap.</p>
            <p class="fw-bold fs-4 text-primary">R$ 99,90</p>
            <button class="btn btn-warning w-75">Comprar Agora</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript do Bootstrap via CDN (necessário para componentes interativos como o menu responsivo) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
