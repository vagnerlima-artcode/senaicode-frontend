<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - IF/ELSE Operadores Ternario</title>
</head>

<body>
    <script>
        var idade = prompt('Digite sua idade: ');

        if (idade >= 0 && idade < 15) {
            // document.write('Está no bloco if(verdadeiro)')
            document.write('Criança');
        } else if (idade >= 15 && idade < 30) {
            // document.write('Está no bloco if(falso)')
            document.write('Jovem');
        } else if (idade >= 30 && idade < 60) {
            document.write('Adulto');
        } else if (idade > 60) {
            document.write('Idoso');
        }



    </script>
</body>

</html>
