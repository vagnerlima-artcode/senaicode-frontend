<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Eventos</title>
</head>

<body>
    <script>
           function oi(){
                alert("Oi, duplo click");
           }
    </script>
    <div ondblclick="oi()" onclick="alert('Mouse clicado')" onmouseover="alert('mouse sobre area')" onmouseout="alert('Mouse fora da area')" style="width:230px; height: 230px; background-color: aqua;"></div>
</body>

</html>
