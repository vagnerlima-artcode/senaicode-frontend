<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Switch</title>
</head>

<body>
    <script>
      var parametro = 'Maria';

      switch(parametro){
        case 1+2:
            document.write('Parametro 1');
            break
        case 'Maria':
            document.write('Parametro 2');
            break
        default:
            document.write('Parametro Default');
      }

    </script> 
</body>

</html>
