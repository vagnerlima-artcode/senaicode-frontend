<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Variaveis</title>
</head>

<body>

    <script>
        //Constante dado que não é modificado durante o programa
        const numeroFixo = 150;
        // Variavel tipo String entre ""
        var texto = "Curso Javascript";
        console.log(texto);
        document.write("Oi SENAI :)");
        // Variavel tipo numero inteiro
        var numero = 100;
        console.log(numero);
        
        // Variavel tipo numero fracionado 1.2
        var numeroFracionado = 432.5;
        console.log(numeroFracionado)

        //Variavel tipo Boleano true || false
        var teste = true;
        console.log(teste);
        
        // Exibe um pop-up com uma informação, evitar usar alert().
        alert(numero);

        //Valor Nulo
        var nulo = null;
        console.log(nulo);
        
        //Valor não definido 
        var naoDefinida = undefined;
        console.log(naoDefinida);

    </script>
</body>

</html>
