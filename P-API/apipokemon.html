<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex - Consumindo PokéAPI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        input,
        button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #ff5350;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #e0423f;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 250px;
            display: none;
            /* Inicia oculto até pesquisar */
        }

        .card img {
            width: 120px;
            height: 120px;
        }

        .types span {
            background-color: #eee;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            margin: 2px;
            display: inline-block;
            text-transform: capitalize;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Pokedex Simples</h1>

    <div class="search-box">
        <input type="text" id="pokemonInput" placeholder="Ex: pikachu ou 25">
        <button onclick="buscarPokemon()">Buscar</button>
    </div>

    <p id="errorMessage" class="error"></p>

    <div id="pokemonCard" class="card">
        <h2 id="pokemonName" style="text-transform: capitalize;"></h2>
        <img id="pokemonImage" src="" alt="Imagem do Pokemon">
        <p><strong>ID:</strong> #<span id="pokemonId"></span></p>
        <p><strong>Tipos:</strong></p>
        <div id="pokemonTypes" class="types"></div>
    </div>
    

    <script>
        async function buscarPokemon() {
            const input = document.getElementById('pokemonInput').value.toLowerCase().trim();
            const card = document.getElementById('pokemonCard');
            const errorMsg = document.getElementById('errorMessage');

            if (!input) {
                alert('Por favor, digite o nome ou ID de um Pokémon.');
                return;
            }

            // Limpa mensagens anteriores
            errorMsg.innerText = '';
            card.style.display = 'none';

            try {
                // Chamada à API
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${input}`);
                // Tratamento de Erro 
                if (!response.ok) {
                    throw new Error('Pokémon não encontrado!');
                }

                const data = await response.json();

                // Atualizando os dados na tela
                document.getElementById('pokemonName').innerText = data.name;
                document.getElementById('pokemonId').innerText = data.id;
                document.getElementById('pokemonImage').src = data.sprites.front_default;

                // Limpa e insere os tipos
                const typesContainer = document.getElementById('pokemonTypes');
                typesContainer.innerHTML = '';
                data.types.forEach(tipoInfo => {
                    const span = document.createElement('span');
                    span.innerText = tipoInfo.type.name;
                    typesContainer.appendChild(span);
                });

                // Exibe o card
                card.style.display = 'block';

            } catch (error) {
                errorMsg.innerText = error.message;
            }
        }
        async function listarTodosPokemons() {
            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1300');
                const data = await response.json();

                console.log(`Total encontrado: ${data.count}`);

                // data.results retorna a lista com nome e URL de detalhes de cada um
                data.results.forEach((pokemon, index) => {
                    console.log(`#${index + 1} - ${pokemon.name}`);
                });
            } catch (error) {
                console.error('Erro ao buscar lista:', error);
            }
        }


    </script>
</body>

</html>
