<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakpoint</title>
</head>
<style>
    .container {
        display: flex;
    }

    .row {
        display: flex;
    }

    .row>div {
        border: 1px solid #fff;
        padding: 10px;
    }

    /* Telas menores */
    @media (max-width:767px) {
        * {
            background-color: red;
        }

        .row {
            display: block;
        }

        #img1{
            display: none;
            /* transition: cubic-bezier(0.075, 0.82, 0.165, 1); */
        }

    }

    /* Telas de tablet */
    @media(min-width:768px) {
        * {
            background: greenyellow;
        }

        .row>div {
            border: 1px dotted black;
        }
    }

    @media (min-width:1024px) {
        * {
            background: violet;
        }
    }

    @media (min-width:1025px) {
        * {
            background: black;
        }

        h1 {
            color: red;
            font-size: 160px;
        }

        .row>div {
            border: 1px solid #fff;
            color: #fff;
        }
    }
</style>

<body>
    <h1>Breakpoint</h1>

    <div class="container">
        <div class="row">
            <div>1
                <img id="img1" src="img/1.jpg" style="width: 300px;;">
            </div>
            <div>2
                <img id="img2" src="img/2.jpg" style="width: 300px;;">

            </div>
            <div>3
                <img id="img3" src="img/3.jpg" style="width: 300px;;">

            </div>
        </div>
    </div>
</body>

</html>
