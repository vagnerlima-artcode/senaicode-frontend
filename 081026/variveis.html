<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Variaveis</title>
</head>

<body>
    <!-- Variaveis -->

    <script>
        //String
        var text = "Curso de Javascript";
        console.log(text);
        document.write(text);
        alert(text); //Não usar muito, considerado invasivo.

        //Number Inteiro
        var numero = 100;
        console.log(numero);
        document.write(numero  + '<br>');

        //Number Fracionado
        let numeroFracao = 100.99;
        console.log(numeroFracao);
        document.write(numeroFracao);

        //Booleano true || false
        let teste = true;
        console.log(teste);
        document.write(teste);

        //Null variavel 
        let valorNulo = null;
        console.log(valorNulo);

        //Não definida
        let valorNaodefinido = undefined;
        console.log(valorNaodefinido);
        
    </script>
</body>

</html>
