<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Switch</title>
</head>

<body>
    <script>
        let valor = 1;
        switch (valor) {
            case 1:
                document.write("Valor menor que 2");
                break
            case 2:
                document.write("Valor maior que 2");
                //faça algo
                break
            default:
            //caso nenhuma das condições sejam atendidas
            document.write("Valor incorreto");
        }
    </script>
</body>

</html>
