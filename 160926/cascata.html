<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascata</title>
    <link rel="stylesheet" href="cascata.css">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        border: 1px solid greenyellow;
    }

    div {
        font-size: 16px;
    }

    h1 {
        margin-left: 10vw;
    }

    figure img {
        width: 100%;
    }

    figcaption {
        color: red;
    }
</style>

<body>
    <figure>
        <img src="games-2453777_960_720.jpg">
        <figcaption>Joystick</figcaption>
    </figure>
    <audio>
        <source src="som.mp3" type="audio/mpeg">
    </audio>
</body>

</html>
