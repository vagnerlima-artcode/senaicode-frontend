<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flex Box</title>

    <style>
        /* 1. Reset para incluir padding na largura total e zerar margens */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            gap: 10px;
            flex-direction: row;
        }

        .container div {
            display: flex;
            /* Removido o width: 100px fixo */
            /* height: 100px; */
            background-color: red;
            padding: 20px;
        }

        .col-10 {
            flex: 0 0 10%;
        }

        .col-30 {
            flex: 0 0 30%;
        }

        .col-70 {
            flex: 0 0 70%;
        }
        .col-100 {
            flex: 0 0 100%;
        }
        #blocos {
            justify-content: center;
        }
        #rodape {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: red;
        }

        nav ul {
            display: flex;
            gap: 10px;
        }

        nav ul li {
            display: flex;
            list-style: none;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
        }

        nav ul li a:hover {
            opacity: 0.8;
        }
        #logo{width: 200px;}
    </style>
</head>

<body>
    <main>
        <header id="top" class="container">
            <div class="col-100">
                <img id="logo" src="img/logo-magalu.png" alt="Logotipo">
                <br><br>
                <nav>
                    <ul>
                        <li><a href="">Link 1</a></li>
                        <li><a href="">Link 2</a></li>
                        <li><a href="">Link 3</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <hr>

        <div id="banner" class="container">
            <div class="col-100">
                <img style="width: 100%; height: auto;" src="img/banner.png" alt="Banner">
            </div>
        </div>
        <hr>
        <div id="blocos" class="container">
            <div class="col-30">Bloco</div>
            <div class="col-30">Bloco</div>
            <div class="col-30">Bloco</div>
        </div>
        <hr>
    </main>
    <div id="rodape" class="container">
        <div class="col-100">Rodape</div>
    </div>
</body>

</html>
